# This is a Declarative Automation Bundle definition for medguardian_ai.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: medguardian_ai
  uuid: 76f1160a-5624-4b08-9ffc-d92fb006fe2a

include:
  - resources/*.yml


# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    presets:
      # Deploy a copy of source files instead of linking to the workspace source.
      source_linked_deployment: false
    workspace:
      host: http://127.0.0.1:7073
    variables:
      catalog: ey_dbx_emea_hackathon_team1
      schema: dev
  prod:
    mode: production
    workspace:
      host: http://127.0.0.1:7073
      # We explicitly deploy to /Workspace/Users/jeevan.prabhakaran.gunasekaran@de.ey.com to make sure we only have a single copy.
      root_path: /Workspace/Users/jeevan.prabhakaran.gunasekaran@de.ey.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: ey_dbx_emea_hackathon_team1
      schema: prod
    permissions:
      - user_name: jeevan.prabhakaran.gunasekaran@de.ey.com
        level: CAN_MANAGE
